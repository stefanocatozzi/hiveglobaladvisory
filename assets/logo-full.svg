<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 500 500" role="img" aria-labelledby="hiveTitle" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="hiveTitle">HIVE Global Advisory — logo</title>

  <defs>
    <path id="hexShape" d="M232.68,60 Q250,50 267.32,60 L405.88,140 Q423.2,150 423.2,170 L423.2,330 Q423.2,350 405.88,360 L267.32,440 Q250,450 232.68,440 L94.12,360 Q76.8,350 76.8,330 L76.8,170 Q76.8,150 94.12,140 Z"/>

    <clipPath id="hexClip">
      <use href="#hexShape" xlink:href="#hexShape"/>
    </clipPath>

    <linearGradient id="hexFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7FB0DD"/>
      <stop offset="45%" stop-color="#4A7FB2"/>
      <stop offset="100%" stop-color="#1E4468"/>
    </linearGradient>

    <radialGradient id="topShine" cx="35%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="bottomShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>

    <filter id="dropShadow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="6" dy="12" stdDeviation="9" flood-color="#0A2438" flood-opacity="0.35"/>
    </filter>

    <filter id="softBlur" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <g filter="url(#dropShadow)">
    <use href="#hexShape" xlink:href="#hexShape" fill="url(#hexFill)"/>
  </g>

  <g clip-path="url(#hexClip)">
    <ellipse cx="175" cy="105" rx="230" ry="150" fill="url(#topShine)"/>
    <rect x="60" y="330" width="380" height="130" fill="url(#bottomShade)"/>
  </g>

  <text x="250" y="282" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="112" letter-spacing="6" fill="#FFFFFF" filter="url(#softBlur)">HIVE</text>
  <text x="250" y="282" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="112" letter-spacing="6" fill="#FFFFFF">HIVE</text>
  <text x="250" y="326" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="23" letter-spacing="2.5" fill="#FFFFFF">Global Advisory</text>
</svg>
